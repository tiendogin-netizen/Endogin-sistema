<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endogin OS</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Azul de verdade, nao quase-preto: a marca e branca, azul e dourada. */
    --eg-bg-0:#0a1730; --eg-bg-1:#102344; --eg-bg-2:#16305a;
    --eg-gold-100:#f2dfae; --eg-gold-300:#e3bd76; --eg-gold-500:#c9974b; --eg-gold-700:#a3762f;
    --eg-text-primary:#f3f0e8; --eg-text-muted:#93a3c2;
    --eg-line:rgba(255,255,255,0.08);
    --eg-ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;background:var(--eg-bg-0);}
  body{font-family:'Montserrat',sans-serif;color:var(--eg-text-primary);overflow-x:hidden;}
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(ellipse 1100px 620px at 50% -12%, #1b3a68 0%, transparent 62%),
      radial-gradient(ellipse 800px 520px at 88% 92%, rgba(28,63,112,0.55), transparent 60%);
  }

  /* ============================ 1a tela: so o logo ============================ */
  .abertura{
    position:relative;height:100vh;width:100%;
    display:flex;align-items:center;justify-content:center;
    background:var(--eg-bg-0);overflow:hidden;z-index:1;
  }

  /* A luz vem de cima. Sao duas camadas: um halo largo que dá o ambiente e um
     cone estreito que dá a direção — sem o cone o logo so parece "brilhante",
     com ele parece iluminado. */
  .luz{
    position:absolute;left:50%;top:-12vh;transform:translateX(-50%);
    width:min(130vw,1200px);height:100vh;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 46% 56% at 50% 0%,
      rgba(242,223,174,0.20) 0%, rgba(201,151,75,0.10) 36%, transparent 72%);
    animation:eg-luz 7s ease-in-out infinite alternate;
  }
  .luz::after{
    content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);
    width:min(86vw,760px);height:82vh;
    clip-path:polygon(40% 0, 60% 0, 100% 100%, 0 100%);
    background:linear-gradient(180deg, rgba(242,223,174,0.13) 0%, rgba(242,223,174,0) 76%);
    filter:blur(28px);
  }
  /* o chao de luz sob o logo, que fecha a leitura do facho */
  .luz-piso{
    position:absolute;left:50%;top:58%;transform:translateX(-50%);
    width:min(70vw,620px);height:180px;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(201,151,75,0.16), transparent 70%);
    filter:blur(22px);
  }

  .logo-grande{
    position:relative;z-index:2;width:clamp(190px,29vw,392px);height:auto;display:block;
    filter:drop-shadow(0 30px 64px rgba(0,0,0,0.7)) drop-shadow(0 0 52px rgba(201,151,75,0.32));
    animation:eg-entra 1.2s var(--eg-ease) both;
  }

  .seta{
    position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);z-index:3;
    width:66px;height:66px;border-radius:999px;cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;color:var(--eg-gold-100);
    background:linear-gradient(150deg, rgba(201,151,75,0.22), rgba(201,151,75,0.05));
    border:1px solid rgba(201,151,75,0.5);
    box-shadow:0 20px 44px -16px rgba(0,0,0,0.85);
    animation:eg-entra 1s var(--eg-ease) .5s both, eg-pula 2.3s ease-in-out 1.5s infinite;
    transition:background .35s var(--eg-ease), border-color .35s var(--eg-ease), color .35s var(--eg-ease);
  }
  .seta::before{
    content:"";position:absolute;inset:-1px;border-radius:999px;pointer-events:none;
    border:1px solid rgba(227,189,118,0.55);
    animation:eg-anel 2.6s ease-out infinite;
  }
  .seta:hover{background:linear-gradient(150deg, rgba(201,151,75,0.38), rgba(201,151,75,0.10));border-color:var(--eg-gold-300);color:#fff;}
  .seta svg{width:28px;height:28px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}

  /* ============================ a cortina ============================ */
  /* Um bloco de uma tela de altura com `clip-path` vira o bloco de contencao
     dos filhos `fixed`: o rodape fica preso na janela mas so aparece dentro
     desse retangulo. Rolando, o retangulo sobe e revela. Sem biblioteca. */
  .rodape-wrap{
    position:relative;height:100vh;width:100%;
    clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%);
  }
  .rodape{
    position:fixed;bottom:0;left:0;width:100%;height:100vh;
    display:flex;flex-direction:column;justify-content:space-between;
    overflow:hidden;background:var(--eg-bg-0);
  }

  .rodape .aurora{
    position:absolute;left:50%;top:50%;width:82vw;height:62vh;
    transform:translate(-50%,-50%);border-radius:50%;filter:blur(84px);
    pointer-events:none;z-index:0;
    background:radial-gradient(circle at 50% 50%,
      rgba(201,151,75,0.17) 0%, rgba(46,96,168,0.16) 42%, transparent 70%);
    animation:eg-respira 8s ease-in-out infinite alternate;
  }
  .rodape .grade{
    position:absolute;inset:0;z-index:0;pointer-events:none;
    background-size:60px 60px;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
    -webkit-mask-image:linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent);
    mask-image:linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent);
  }

  /* Duas linhas porque "MENTORIA ENDOGIN" numa linha so nao cabe em tela
     nenhuma sem virar um borrao cortado no meio da palavra. */
  .gigante{
    position:absolute;left:50%;bottom:-6vh;z-index:0;text-align:center;
    font-family:'Sora',sans-serif;font-weight:800;font-size:min(15vw,230px);
    line-height:.8;letter-spacing:-.05em;white-space:nowrap;
    color:transparent;-webkit-text-stroke:1px rgba(243,240,232,0.07);
    background:linear-gradient(180deg, rgba(243,240,232,0.11) 0%, transparent 64%);
    -webkit-background-clip:text;background-clip:text;
    pointer-events:none;user-select:none;
    transform:translate(-50%, calc((1 - var(--p,0)) * 10vh)) scale(calc(.86 + var(--p,0) * .14));
    opacity:var(--p,0);
  }

  .marquise{
    position:absolute;top:10vh;left:0;width:100%;z-index:10;overflow:hidden;
    padding:14px 0;border-top:1px solid var(--eg-line);border-bottom:1px solid var(--eg-line);
    background:rgba(16,35,68,0.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transform:rotate(-2deg) scale(1.1);box-shadow:0 24px 60px rgba(0,0,0,0.5);
  }
  .marquise-trilho{display:flex;width:max-content;animation:eg-corre 42s linear infinite;}
  .marquise-item{
    display:flex;align-items:center;gap:44px;padding:0 22px;
    font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--eg-text-muted);
    white-space:nowrap;
  }
  .marquise-item b{color:var(--eg-gold-500);font-weight:700;}

  .rodape-centro{
    position:relative;z-index:10;flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:36px;
    padding:26vh 24px 0;width:100%;max-width:960px;margin:0 auto;
  }
  .rodape-titulo{
    font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(32px,6vw,72px);
    letter-spacing:-.03em;line-height:1.03;margin:0;text-align:center;
    background:linear-gradient(180deg, var(--eg-text-primary) 0%, rgba(243,240,232,0.38) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(243,240,232,0.10));
    transform:translateY(calc((1 - var(--q,0)) * 46px));opacity:var(--q,0);
  }
  .pilulas{
    display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:100%;
    transform:translateY(calc((1 - var(--q,0)) * 46px));opacity:var(--q,0);
  }

  .pilula{
    display:inline-flex;align-items:center;gap:12px;text-decoration:none;
    padding:17px 30px;border-radius:999px;
    font-size:13.5px;font-weight:700;color:var(--eg-text-primary);
    background:linear-gradient(145deg, rgba(243,240,232,0.05) 0%, rgba(243,240,232,0.014) 100%);
    border:1px solid rgba(243,240,232,0.10);
    box-shadow:0 10px 30px -10px rgba(0,0,0,0.6), inset 0 1px 1px rgba(243,240,232,0.10);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    transition:background .4s var(--eg-ease), border-color .4s var(--eg-ease), box-shadow .4s var(--eg-ease);
    will-change:transform;
  }
  .pilula:hover{
    background:linear-gradient(145deg, rgba(201,151,75,0.16) 0%, rgba(243,240,232,0.02) 100%);
    border-color:rgba(201,151,75,0.5);
    box-shadow:0 20px 40px -10px rgba(0,0,0,0.7), inset 0 1px 1px rgba(243,240,232,0.22);
  }
  .pilula .ico{font-size:17px;color:var(--eg-gold-300);}
  .pilula small{display:block;font-size:10.5px;font-weight:500;color:var(--eg-text-muted);letter-spacing:.02em;margin-top:2px;}

  .rodape-pe{
    position:relative;z-index:20;width:100%;padding:0 26px 30px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .credito{font-size:9.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--eg-text-muted);}

  .topo-btn{
    width:48px;height:48px;border-radius:999px;flex:none;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    color:var(--eg-text-muted);font-size:16px;
    background:rgba(243,240,232,0.035);border:1px solid rgba(243,240,232,0.10);
    transition:color .3s var(--eg-ease), border-color .3s var(--eg-ease);
    will-change:transform;
  }
  .topo-btn:hover{color:var(--eg-gold-300);border-color:rgba(201,151,75,0.5);}
  .topo-btn span{display:block;transition:transform .3s var(--eg-ease);}
  .topo-btn:hover span{transform:translateY(-3px);}

  @keyframes eg-entra{from{opacity:0;transform:translateY(18px) scale(.96);}to{opacity:1;transform:none;}}
  @keyframes eg-luz{0%{opacity:.72;}100%{opacity:1;}}
  @keyframes eg-pula{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,10px);}}
  @keyframes eg-anel{0%{transform:scale(1);opacity:.7;}100%{transform:scale(1.55);opacity:0;}}
  @keyframes eg-respira{0%{transform:translate(-50%,-50%) scale(1);opacity:.6;}100%{transform:translate(-50%,-50%) scale(1.1);opacity:1;}}
  @keyframes eg-corre{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  @media (max-width:760px){
    .gigante{font-size:19vw;}
    /* No celular a cortina com `fixed` engasga: a barra de endereco aparece e
       some e muda a altura da janela no meio da rolagem. Aqui o rodape vira
       bloco normal — perde o efeito, mantem o conteudo. */
    .rodape-wrap{height:auto;clip-path:none;}
    .rodape{position:relative;height:auto;min-height:100vh;}
    .marquise{position:relative;top:0;margin-top:8vh;}
    .rodape-centro{padding:8vh 20px 0;gap:28px;}
    .pilula{width:100%;justify-content:center;}
    .rodape-pe{padding:0 20px 26px;}
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    .logo-grande,.seta,.seta::before,.luz,.aurora,.marquise-trilho{animation:none;}
    .gigante,.rodape-titulo,.pilulas{transform:none;opacity:1;}
  }
</style>
</head>
<body>

<section class="abertura">
  <div class="luz"></div>
  <div class="luz-piso"></div>
  <img class="logo-grande" src="/assets/logo-endogin.png" alt="Mentoria Endogin">

  <button class="seta" id="setaDesce" type="button" aria-label="Rolar para baixo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14M5.5 12.5 12 19l6.5-6.5"/></svg>
  </button>
</section>

<div class="rodape-wrap" id="rodapeWrap">
  <footer class="rodape">
    <div class="aurora"></div>
    <div class="grade"></div>
    <div class="gigante" id="gigante">MENTORIA<br>ENDOGIN</div>

    <div class="marquise">
      <div class="marquise-trilho" id="marquiseTrilho"></div>
    </div>

    <div class="rodape-centro">
      <h2 class="rodape-titulo" id="rodapeTitulo">Conhecimento que transforma consultórios e vidas.</h2>

      <div class="pilulas" id="pilulas">
        <a class="pilula magnetico" href="/Endogin_Area_CS_Live.html">
          <span class="ico">&#128101;</span>
          <span>Área CS<small>Para a equipe</small></span>
        </a>
        <a class="pilula magnetico" href="/Portal_Aluno_Live.html">
          <span class="ico">&#127891;</span>
          <span>Portal do Aluno<small>Para os mentorados</small></span>
        </a>
        <a class="pilula magnetico" href="/Area_Doutores_Live.html">
          <span class="ico">&#128200;</span>
          <span>Área da Diretoria<small>Dr. Caio e Dr. Vinícius</small></span>
        </a>
      </div>
    </div>

    <div class="rodape-pe">
      <div class="credito">&copy; 2026 Mentoria Endogin</div>
      <button class="topo-btn magnetico" id="voltarTopo" type="button" aria-label="Voltar ao topo">
        <span>&uarr;</span>
      </button>
    </div>
  </footer>
</div>

<script>
(function(){
  var reduzido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------------- marquise ----------------
  // O trilho e duplicado porque a animacao anda -50%: com uma copia so, a
  // volta ao inicio apareceria como um salto.
  var FRASES = [
    "Acompanhamento de verdade", "Jornada do mentorado", "Sessões 1x1",
    "Trilha de boas-vindas", "Renovação que se constrói"
  ];
  var trilho = document.getElementById("marquiseTrilho");
  if(trilho){
    var bloco = '<div class="marquise-item">' +
      FRASES.map(function(f){ return "<span>" + f + "</span> <b>&#10022;</b>"; }).join(" ") +
      '</div>';
    trilho.innerHTML = bloco + bloco;
  }

  // ---------------- botoes magneticos ----------------
  // O elemento e puxado na direcao do cursor e volta com sobra elastica:
  // transform + troca da curva na saida, sem biblioteca.
  if(!reduzido && window.matchMedia("(hover: hover)").matches){
    document.querySelectorAll(".magnetico").forEach(function(el){
      el.addEventListener("mousemove", function(e){
        var r = el.getBoundingClientRect();
        var x = e.clientX - r.left - r.width / 2;
        var y = e.clientY - r.top - r.height / 2;
        el.style.transition = "transform .15s linear";
        el.style.transform = "translate(" + (x * 0.28) + "px," + (y * 0.34) + "px) scale(1.04)";
      });
      el.addEventListener("mouseleave", function(){
        el.style.transition = "transform .9s cubic-bezier(.18,1.6,.3,1)";
        el.style.transform = "translate(0,0) scale(1)";
      });
    });
  }

  // ---------------- cortina ----------------
  // Uma conta so: quanto do bloco da cortina ja subiu na janela. Esse numero
  // (0 a 1) vira variavel CSS e o resto e feito pelo proprio CSS.
  var wrap = document.getElementById("rodapeWrap");
  var gigante = document.getElementById("gigante");
  var titulo = document.getElementById("rodapeTitulo");
  var pilulas = document.getElementById("pilulas");
  var pendente = false;

  function faixa(v, de, ate){
    if(ate === de) return 0;
    return Math.max(0, Math.min(1, (v - de) / (ate - de)));
  }

  function desenha(){
    pendente = false;
    if(!wrap) return;
    var topo = wrap.getBoundingClientRect().top;
    var altura = window.innerHeight || 1;
    var p = Math.max(0, Math.min(1, 1 - topo / altura));

    gigante.style.setProperty("--p", p.toFixed(3));
    // o texto e as pilulas entram depois do fundo, senao tudo chega junto e a
    // sensacao de profundidade se perde
    var q = faixa(p, 0.25, 0.85).toFixed(3);
    titulo.style.setProperty("--q", q);
    pilulas.style.setProperty("--q", q);
  }

  function agenda(){
    if(pendente) return;
    pendente = true;
    window.requestAnimationFrame(desenha);
  }

  if(!reduzido){
    window.addEventListener("scroll", agenda, { passive: true });
    window.addEventListener("resize", agenda);
    desenha();
  }

  var seta = document.getElementById("setaDesce");
  if(seta){
    seta.addEventListener("click", function(){
      window.scrollTo({ top: window.innerHeight, behavior: reduzido ? "auto" : "smooth" });
    });
  }

  var btnTopo = document.getElementById("voltarTopo");
  if(btnTopo){
    btnTopo.addEventListener("click", function(){
      window.scrollTo({ top: 0, behavior: reduzido ? "auto" : "smooth" });
    });
  }
})();
</script>
</body>
</html>
