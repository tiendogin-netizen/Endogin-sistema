<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endogin OS</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --eg-bg-0:#0b1420; --eg-bg-1:#101d2e; --eg-bg-2:#152436;
    --eg-gold-100:#f2dfae; --eg-gold-300:#e3bd76; --eg-gold-500:#c9974b; --eg-gold-700:#a3762f;
    --eg-text-primary:#f3f0e8; --eg-text-muted:#8792a8; --eg-navy-line:rgba(255,255,255,0.07);
    --eg-border:rgba(255,255,255,0.09); --eg-border-strong:rgba(201,151,75,0.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--eg-bg-0);}
  body{
    min-height:100vh;font-family:'Montserrat',sans-serif;color:var(--eg-text-primary);
    display:flex;flex-direction:column;align-items:center;
  }

  .hero{position:relative;width:100%;height:min(52vh,460px);min-height:280px;overflow:hidden;}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;}
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom, rgba(11,20,32,0.05) 0%, rgba(11,20,32,0.35) 45%, var(--eg-bg-0) 96%),
               linear-gradient(to right, rgba(11,20,32,0.55) 0%, rgba(11,20,32,0) 35%, rgba(11,20,32,0) 65%, rgba(11,20,32,0.55) 100%);
  }

  .logo-wrap{position:relative;margin-top:-64px;z-index:2;animation:eg-rise .7s cubic-bezier(.2,.8,.2,1) both;}
  .logo-badge{width:150px;height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,0.5));}

  .wrap{width:100%;max-width:440px;text-align:center;padding:18px 24px 48px;}
  h1{font-family:'Sora',sans-serif;font-weight:600;font-size:23px;margin:6px 0 6px;
    background:linear-gradient(180deg,var(--eg-gold-100),var(--eg-gold-500));-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:eg-rise .7s cubic-bezier(.2,.8,.2,1) .08s both;}
  p.sub{color:var(--eg-text-muted);font-size:13px;margin:0 0 30px;letter-spacing:.2px;
    animation:eg-rise .7s cubic-bezier(.2,.8,.2,1) .14s both;}

  .card{background:var(--eg-bg-1);border:1px solid var(--eg-navy-line);border-radius:14px;padding:20px;margin-bottom:14px;
    text-align:left;display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;
    transition:border-color .2s, transform .2s, box-shadow .2s;
    animation:eg-rise .7s cubic-bezier(.2,.8,.2,1) both;}
  .card:nth-of-type(1){animation-delay:.2s;}
  .card:nth-of-type(2){animation-delay:.28s;}
  .card:hover{border-color:var(--eg-border-strong);transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,0.35);}
  .card-icon{width:46px;height:46px;border-radius:11px;background:var(--eg-bg-2);display:flex;align-items:center;justify-content:center;
    font-size:20px;color:var(--eg-gold-300);flex:none;transition:background .2s;}
  .card:hover .card-icon{background:linear-gradient(145deg,var(--eg-gold-300),var(--eg-gold-700));color:#241705;}
  .card-title{font-weight:700;font-size:14.5px;margin-bottom:3px;}
  .card-desc{font-size:12px;color:var(--eg-text-muted);line-height:1.4;}
  .card-arrow{margin-left:auto;color:var(--eg-text-muted);font-size:14px;flex:none;transition:transform .2s, color .2s;}
  .card:hover .card-arrow{transform:translateX(3px);color:var(--eg-gold-300);}

  @keyframes eg-rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){.logo-wrap,h1,p.sub,.card{animation:none;}}
</style>
</head>
<body>
  <div class="hero"><img src="/assets/hero-caio-vinicius.jpg" alt="Dr. Caio e Dr. Vinícius"></div>
  <div class="logo-wrap"><img class="logo-badge" src="/assets/logo-endogin.png" alt="Mentoria Endogin"></div>
  <div class="wrap">
    <h1>Endogin OS</h1>
    <p class="sub">Escolha onde você quer entrar</p>
    <a class="card" href="/Endogin_Area_CS_Live.html">
      <div class="card-icon">&#128101;</div>
      <div>
        <div class="card-title">Área CS</div>
        <div class="card-desc">Equipe — alunos, CRM, sessões, grupos de WhatsApp e mais</div>
      </div>
      <div class="card-arrow">&#10132;</div>
    </a>
    <a class="card" href="/Portal_Aluno_Live.html">
      <div class="card-icon">&#127891;</div>
      <div>
        <div class="card-title">Portal do Aluno</div>
        <div class="card-desc">Mentorados — acompanhamento da jornada na mentoria</div>
      </div>
      <div class="card-arrow">&#10132;</div>
    </a>
  </div>
</body>
</html>
